<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz: Fasta fraser</title>
  <style>
    :root { --bg: #f7f4ec; --ink: #17221d; --muted: #65736b; --line: #d9ded4; --green: #176b54; --dark: #0e4d3c; --mint: #dceee4; --red: #b64332; --shadow: rgba(23,34,29,.08); }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 8% 8%, #f3c96940, transparent 24rem), radial-gradient(circle at 92% 82%, #dceee4b3, transparent 28rem), var(--bg); font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(900px, calc(100% - 28px)); margin: 0 auto; padding: 42px 0 60px; }
    .eyebrow { color: var(--green); font: 700 12px Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(2.5rem, 7vw, 4rem); line-height: .98; font-weight: 500; }
    .intro { color: var(--muted); font-size: 1.08rem; line-height: 1.55; margin-bottom: 24px; }
    .quiz-box { padding: 8px 22px 22px; border: 1px solid var(--line); background: rgba(255,253,247,.9); box-shadow: 0 18px 45px var(--shadow); }
    .question { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .question:last-child { border-bottom: 0; }
    .label { display: block; margin-bottom: 12px; font-size: 1.08rem; line-height: 1.5; }
    .options { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; transition: background .2s ease, border-color .2s ease; }
    .option:hover { border-color: var(--green); background: #f5faf7; }
    .option input { margin-top: 4px; accent-color: var(--green); }
    button { padding: 13px 20px; border: 0; border-radius: 8px; background: var(--green); color: white; font: 700 13px Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
    button.secondary { background: #6b7a73; }
    button:hover { filter: brightness(.97); }
    .listen-button { margin-top: 12px; padding: 9px 13px; background: var(--mint); color: var(--dark); font-size: 12px; }
    .status { min-height: 24px; margin-top: 10px; font: 700 .82rem Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
    .status.correct { color: var(--dark); }
    .status.incorrect { color: var(--red); }
    .translation { display: none; margin-top: 8px; color: var(--muted); font-size: .98rem; line-height: 1.5; }
    .translation.visible { display: block; }
    .translation p { margin: 8px 0; }
    .controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 25px; }
    .result-summary { min-height: 24px; margin-top: 4px; color: var(--dark); font: 700 14px Arial, sans-serif; }
    .nav-link { display: inline-block; margin-top: 18px; color: var(--green); text-decoration: none; font: 700 14px Arial, sans-serif; }
    .nav-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Svenska · fasta fraser</div>
    <h1>Quiz: Fasta fraser</h1>
    <p class="intro">Välj den fasta fras som passar i meningen. Läs eller lyssna sedan på den färdiga meningen med engelsk översättning.</p>
    <div class="quiz-box" id="quiz"></div>
    <div class="controls">
      <button type="button" id="checkBtn">Rätta obesvarade</button>
      <button type="button" class="secondary" id="resetBtn">Börja om</button>
    </div>
    <p class="result-summary" id="summary" aria-live="polite"></p>
    <a class="nav-link" href="index.html">Tillbaka till startsidan</a>
  </main>

  <script>
    const questions = [
      { prompt: 'Vid fyra ______. (När hon var fyra år)', answer: 'års ålder', sentence: 'Vid fyra års ålder.', english: 'At the age of four.' },
      { prompt: 'Familjen hade inte ______ att skicka flickorna utomlands. (De hade inte pengar till det.)', answer: 'råd', sentence: 'Familjen hade inte råd att skicka flickorna utomlands.', english: 'The family could not afford to send the girls abroad.' },
      { prompt: 'Marie och Pierre ______ att söka patent på sin upptäckt. (De var inte intresserade av att göra det.)', answer: 'brydde sig inte om', sentence: 'Marie och Pierre brydde sig inte om att söka patent på sin upptäckt.', english: 'Marie and Pierre did not care about applying for a patent for their discovery.' },
      { prompt: 'Marie var intresserad av hur det kunde ______ att det kom ljusstrålar ur uranet. (Hon ville veta varför.)', answer: 'komma sig', sentence: 'Marie var intresserad av hur det kunde komma sig att det kom ljusstrålar ur uranet.', english: 'Marie was interested in how it could be that rays of light came from the uranium.' },
      { prompt: 'Marie ______ sig åt forskningen. (Hon sysslade med forskningen.)', answer: 'ägnade', sentence: 'Marie ägnade sig åt forskningen.', english: 'Marie devoted herself to research.' },
      { prompt: 'Marie ______ examen med högsta betyg. (Hon klarade examen.)', answer: 'avlade', sentence: 'Marie avlade examen med högsta betyg.', english: 'Marie passed her exam with the highest grade.' }
    ];

    const answers = ['års ålder', 'råd', 'brydde sig inte om', 'komma sig', 'ägnade', 'avlade'];
    const quiz = document.querySelector('#quiz');
    const summary = document.querySelector('#summary');

    function shuffled(items) { return [...items].sort(() => Math.random() - .5); }

    function renderQuiz() {
      quiz.innerHTML = questions.map((question, index) => `
        <section class="question">
          <label class="label"><strong>${index + 1}.</strong> ${question.prompt}</label>
          <ul class="options">
            ${shuffled(answers).map(answer => `<li><label class="option"><input type="radio" name="question-${index}" value="${answer}"><span>${answer}</span></label></li>`).join('')}
          </ul>
          <button type="button" class="listen-button" data-question="${index}">Lyssna på svenska</button>
          <div class="status" id="status-${index}" aria-live="polite"></div>
          <div class="translation" id="translation-${index}"></div>
        </section>
      `).join('');
      summary.textContent = '';
      quiz.querySelectorAll('input[type="radio"]').forEach(input => input.addEventListener('change', () => checkQuestion(Number(input.name.split('-')[1]))));
      quiz.querySelectorAll('.listen-button').forEach(button => button.addEventListener('click', () => speakQuestion(Number(button.dataset.question))));
    }

    function speakQuestion(index) {
      if (!('speechSynthesis' in window)) { summary.textContent = 'Din webbläsare stöder inte uppläsning.'; return; }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(questions[index].sentence);
      utterance.lang = 'sv-SE';
      utterance.rate = .85;
      window.speechSynthesis.speak(utterance);
    }

    function checkQuestion(index) {
      const question = questions[index];
      const selected = document.querySelector(`input[name="question-${index}"]:checked`);
      const status = document.querySelector(`#status-${index}`);
      const translation = document.querySelector(`#translation-${index}`);
      status.className = 'status';
      translation.className = 'translation visible';
      translation.innerHTML = `<p><strong>Svenska:</strong> ${question.sentence}<br><strong>English:</strong> ${question.english}</p>`;
      if (selected.value === question.answer) { status.textContent = 'Rätt!'; status.classList.add('correct'); }
      else { status.textContent = `Inte riktigt. Rätt svar: ${question.answer}`; status.classList.add('incorrect'); }
      updateSummary();
    }

    function updateSummary() {
      const answered = questions.filter((_, index) => document.querySelector(`input[name="question-${index}"]:checked`));
      const score = answered.filter(question => { const index = questions.indexOf(question); return document.querySelector(`input[name="question-${index}"]:checked`)?.value === question.answer; }).length;
      summary.textContent = `Resultat: ${score} av ${answered.length} besvarade (${questions.length} frågor).`;
    }

    function checkQuiz() {
      questions.forEach((question, index) => {
        if (document.querySelector(`input[name="question-${index}"]:checked`)) checkQuestion(index);
        else { const status = document.querySelector(`#status-${index}`); status.className = 'status incorrect'; status.textContent = 'Välj ett svar.'; }
      });
      updateSummary();
    }

    document.querySelector('#checkBtn').addEventListener('click', checkQuiz);
    document.querySelector('#resetBtn').addEventListener('click', () => { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); renderQuiz(); });
    renderQuiz();
  </script>
</body>
</html>
